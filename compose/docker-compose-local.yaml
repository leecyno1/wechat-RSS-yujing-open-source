version: '3.9'
services:
  we-mp-rss:
    build:
      context: ..
      dockerfile: Dockerfile
    image: we-mp-rss-local:latest
    container_name: we-mp-rss
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - ./.env.local
    environment:
      # 依赖/浏览器缓存与 venv 持久化目录（必须挂载到卷内，避免容器重建后缺依赖）
      - PLANT_PATH=/app/data
      - DB=sqlite:///data/db.db
      - USERNAME=admin
      - PASSWORD=admin@123
      # 公域注册（本地默认开启，若不需要可改为 False）
      - ALLOW_REGISTER=True
      # 本地快速启动建议关闭（采集功能如需浏览器再打开）
      - INSTALL=False
      # 正式版默认关闭代码热重载（需要改的话在 env 里改 AUTO_RELOAD=True）
      - AUTO_RELOAD=False
      # LLM/洞察开关统一放到 compose/.env.local（本地文件，已加入 .gitignore）
    volumes:
      - ../data:/app/data
