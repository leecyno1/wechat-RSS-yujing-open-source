version: '3.9'
services:
  mysql:
    image: docker.1ms.run/mysql:8.3.0
    container_name: db-mp
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: we_mp_rss
      MYSQL_USER: rss_user
      MYSQL_PASSWORD: pass123456
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d

  we-mp-rss:
    image: ghcr.io/leecyno1/wechat-rss-yujing-open-source:latest
    container_name: we-mp-rss
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      # 注意：docker compose 内服务间访问请使用 service 名称（这里是 mysql），而不是 container_name(db-mp)
      - DB=mysql+pymysql://rss_user:pass123456@mysql/we_mp_rss?charset=utf8mb4
      - USERNAME=admin
      - PASSWORD=admin@123
      # 自动全量更新：每天 06:00 / 15:00 / 21:00 更新所有公众号，并触发洞察/全文拆解缓存
      - AUTO_UPDATE_ENABLE=True
      - AUTO_UPDATE_CRON_MORNING=0 6 * * *
      - AUTO_UPDATE_CRON_AFTERNOON=0 15 * * *
      - AUTO_UPDATE_CRON_EVENING=0 21 * * *
      - AUTO_UPDATE_MAX_PAGE=1
      # 可选：启用LLM全文拆解（不要把密钥写进仓库，建议通过 .env 注入）
      - SILICONFLOW_API_URL=https://api.siliconflow.cn/v1
      - SILICONFLOW_MODEL=Qwen/Qwen3-30B-A3B
      - SILICONFLOW_API_KEY=
    volumes:
      - ./data:/app/data
    depends_on:
      - mysql

volumes:
  db_data:

networks:
  we-mp-rss:


